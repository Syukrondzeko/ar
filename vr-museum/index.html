<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VR Museum</title>
    <!-- A-Frame: 3D / VR framework in HTML -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- aframe-extras: "animation-mixer" plays animations inside .glb files -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <!-- aframe-environment-component: sky, ground and mountains generated by code (no big files) -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

    <script>
      // fit-model: scale any model so its HEIGHT = size (meters), standing on y = 0, centered
      AFRAME.registerComponent("fit-model", {
        // hide: remove parts whose material name starts with one of these (before measuring)
        schema: { size: { type: "number", default: 1.6 }, hide: { type: "array", default: [] } },
        init() {
          this.el.addEventListener("model-loaded", () => {
            const mesh = this.el.getObject3D("mesh");
            if (this.data.hide.length) {
              const remove = [];
              mesh.traverse((o) => { if (o.isMesh && this.data.hide.some((h) => (o.material.name || "").startsWith(h))) remove.push(o); });
              remove.forEach((o) => o.parent.remove(o));
            }
            const parent = mesh.parent;
            parent.remove(mesh);
            mesh.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(mesh);
            parent.add(mesh);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const s = this.data.size / size.y;
            mesh.scale.multiplyScalar(s);
            mesh.position.set(-center.x * s, -box.min.y * s, -center.z * s);
            mesh.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
          });
        },
      });

      // teleport: click this spot and the player glides there
      AFRAME.registerComponent("teleport", {
        schema: { lookAt: { type: "vec3" } },
        init() {
          this.el.addEventListener("click", () => {
            const rig = document.getElementById("rig");
            const p = this.el.object3D.position;
            rig.setAttribute("animation__tp", {
              property: "position", to: `${p.x} 0 ${p.z}`, dur: 900, easing: "easeInOutQuad",
            });
            // turn to face the exhibit (and undo any WASD walking offset inside the rig)
            const cam = document.getElementById("camera");
            cam.object3D.position.x = 0;
            cam.object3D.position.z = 0;
            const t = this.data.lookAt;
            const yaw = Math.atan2(-(t.x - p.x), -(t.z - p.z));
            cam.components["look-controls"].yawObject.rotation.y = yaw;
            cam.components["look-controls"].pitchObject.rotation.x = 0;
          });
          // glow when the mouse is over it
          this.el.addEventListener("mouseenter", () => this.el.setAttribute("material", "opacity", 0.9));
          this.el.addEventListener("mouseleave", () => this.el.setAttribute("material", "opacity", 0.45));
        },
      });

      // guide: the robot turns to face you, waves when you come close, and says hello
      AFRAME.registerComponent("guide", {
        init() {
          this.near = false;
          this.cam = document.getElementById("camera");
          this.bubble = document.getElementById("bubble");
          this.el.addEventListener("animation-finished", () =>
            this.el.setAttribute("animation-mixer", { clip: "Idle", loop: "repeat", crossFadeDuration: 0.3 }));
        },
        tick() {
          const me = this.el.object3D.position;
          const you = new THREE.Vector3();
          this.cam.object3D.getWorldPosition(you);
          const d = Math.hypot(you.x - me.x, you.z - me.z);
          // always face the player
          this.el.object3D.rotation.y = Math.atan2(you.x - me.x, you.z - me.z);
          if (d < 4 && !this.near) {
            this.near = true;
            this.el.setAttribute("animation-mixer", { clip: "Wave", loop: "once", crossFadeDuration: 0.3 });
            this.bubble.setAttribute("visible", true);
          } else if (d > 5 && this.near) {
            this.near = false;
            this.bubble.setAttribute("visible", false);
          }
        },
      });


      // look-at: make the speech bubble face the camera (simple billboard)
      AFRAME.registerComponent("look-at", {
        schema: { type: "selector" },
        tick() {
          if (!this.data) return;
          const p = new THREE.Vector3();
          this.data.object3D.getWorldPosition(p);
          const me = this.el.object3D.position;
          this.el.object3D.rotation.y = Math.atan2(p.x - me.x, p.z - me.z);
        },
      });

      // click-anim: clicking a model plays an animation once (robot dances, fox runs)
      AFRAME.registerComponent("click-anim", {
        schema: { clip: { type: "string" }, idle: { type: "string" }, loops: { type: "number", default: 1 } },
        init() {
          this.el.addEventListener("click", () => {
            this.el.setAttribute("animation-mixer", { clip: this.data.clip, loop: "repeat", repetitions: this.data.loops, crossFadeDuration: 0.3 });
          });
          this.el.addEventListener("animation-finished", () => {
            if (this.data.idle) this.el.setAttribute("animation-mixer", { clip: this.data.idle, loop: "repeat", repetitions: Infinity, crossFadeDuration: 0.3 });
          });
        },
      });
    </script>

    <style>
      body { margin: 0; font-family: -apple-system, sans-serif; }
      .hud {
        position: fixed; z-index: 10; background: rgba(0, 0, 0, 0.6); color: #fff;
        border-radius: 12px; padding: 8px 12px; font-size: 13px; text-decoration: none;
      }
      #help { left: 50%; bottom: 16px; transform: translateX(-50%); white-space: nowrap; }
      #help b { color: #ffd93b; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
        background: #cfe3f5; color: #234; font-size: 20px; transition: opacity 0.6s;
      }
    </style>
  </head>
  <body>
    <div id="loading">🏛️ Opening the museum…</div>
    <a class="hud" href="../" style="top: 12px; left: 12px;">← Menu</a>
    <div class="hud" id="help">🖱️ <b>Drag</b> to look · ⌨️ <b>W A S D</b> to walk · 🔵 <b>Click circles</b> to teleport · 👆 <b>Click</b> the robot or fox</div>

    <a-scene
      renderer="colorManagement: true; antialias: true"
      shadow="type: pcfsoft"
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable"
      environment="preset: default; ground: hills; groundYScale: 4; playArea: 3; dressing: trees; dressingAmount: 30;
                   dressingScale: 2.5; dressingColor: #6a9a5b; groundColor: #8fb67a; groundColor2: #82a96f;
                   grid: none; lighting: none; shadow: false; skyType: gradient; skyColor: #7fb8e8; horizonColor: #e9f2fa"
    >
      <!-- Lights (with shadows) -->
      <a-entity light="type: hemisphere; color: #ffffff; groundColor: #a89f8c; intensity: 0.8"></a-entity>
      <a-entity light="type: directional; intensity: 1.1; castShadow: true; shadowMapWidth: 2048; shadowMapHeight: 2048;
                       shadowCameraLeft: -18; shadowCameraRight: 18; shadowCameraTop: 18; shadowCameraBottom: -18; shadowCameraFar: 60"
                position="8 20 10"></a-entity>

      <!-- ===== PLAYER: a "rig" you move, with the camera at eye height (1.6 m) ===== -->
      <a-entity id="rig" position="0 0 11">
        <a-entity id="camera" camera position="0 1.6 0"
          look-controls="pointerLockEnabled: false; reverseMouseDrag: false"
          wasd-controls="acceleration: 35"></a-entity>
      </a-entity>

      <!-- ===== MUSEUM PLAZA ===== -->
      <a-cylinder position="0 -0.03 0" radius="16" height="0.1" color="#cfc5b2" shadow="receive: true"></a-cylinder>
      <a-ring position="0 0.03 0" rotation="-90 0 0" radius-inner="15.5" radius-outer="16" color="#c9b98f"></a-ring>
      <a-ring position="0 0.03 0" rotation="-90 0 0" radius-inner="2.6" radius-outer="2.8" color="#c9b98f"></a-ring>
      <!-- Museum sign at the entrance -->
      <a-entity position="0 0 13.5">
        <a-box position="-2.6 1.4 0" width="0.2" height="2.8" depth="0.2" color="#8a7552" shadow></a-box>
        <a-box position="2.6 1.4 0" width="0.2" height="2.8" depth="0.2" color="#8a7552" shadow></a-box>
        <a-box position="0 2.9 0" width="5.6" height="0.7" depth="0.15" color="#3b2f22"></a-box>
        <a-text value="LANDMARK MUSEUM" align="center" position="0 2.9 0.09" width="7" color="#ffd93b"></a-text>
      </a-entity>

      <!-- ===== EXHIBIT 1: EIFFEL TOWER ===== -->
      <a-entity position="-7 0 -4">
        <a-cylinder radius="3.2" height="0.5" position="0 0.25 0" color="#d9d2c3" shadow="receive: true"></a-cylinder>
        <a-cylinder radius="3.35" height="0.08" position="0 0.5 0" color="#c9b98f"></a-cylinder>
        <a-entity position="0 0.54 0" gltf-model="url(../image-tracking/models/eiffel.glb)" fit-model="size: 8; hide: FrontColor, Google_Earth" rotation="0 30 0"></a-entity>
        <!-- Info sign -->
        <a-entity position="3.6 0 2.6" rotation="0 0 0">
          <a-box position="0 0.6 0" width="0.1" height="1.2" depth="0.1" color="#555"></a-box>
          <a-entity position="0 1.55 0" rotation="-15 0 0">
            <a-plane width="2.2" height="1.4" color="#1f2a36"></a-plane>
            <a-text position="0 0.45 0.02" align="center" width="3.2" color="#ffd93b" value="Eiffel Tower"></a-text>
            <a-text position="-0.98 -0.1 0.02" width="2" color="#ffffff" baseline="center" line-height="58"
              value="Paris, France&#10;Finished: 1889, for the World's Fair&#10;Height: 330 m (with antennas)&#10;Made of about 7,300 tonnes of iron&#10;Repainted about every 7 years"></a-text>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ===== EXHIBIT 2: LEANING TOWER OF PISA ===== -->
      <a-entity position="7 0 -4">
        <a-cylinder radius="2.6" height="0.5" position="0 0.25 0" color="#d9d2c3" shadow="receive: true"></a-cylinder>
        <a-cylinder radius="2.75" height="0.08" position="0 0.5 0" color="#c9b98f"></a-cylinder>
        <a-entity position="0 0.54 0" gltf-model="url(../image-tracking/models/pisa.glb)" fit-model="size: 6.5" rotation="0 -20 0"></a-entity>
        <!-- Info sign -->
        <a-entity position="-3.2 0 2.4" rotation="0 0 0">
          <a-box position="0 0.6 0" width="0.1" height="1.2" depth="0.1" color="#555"></a-box>
          <a-entity position="0 1.55 0" rotation="-15 0 0">
            <a-plane width="2.2" height="1.4" color="#1f2a36"></a-plane>
            <a-text position="0 0.45 0.02" align="center" width="3.2" color="#ffd93b" value="Leaning Tower of Pisa"></a-text>
            <a-text position="-0.98 -0.1 0.02" width="2" color="#ffffff" baseline="center" line-height="58"
              value="Pisa, Italy&#10;Started: 1173, took about 200 years&#10;Height: about 56 m&#10;Leans about 4 degrees&#10;Soft ground made it start tilting"></a-text>
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- ===== GUIDES ===== -->
      <!-- Robot guide near the entrance: faces you, waves when you come close, dances when clicked -->
      <a-entity id="robot" class="clickable" position="2.2 0 7.5"
        gltf-model="url(../hiro-model/models/robot.glb)" fit-model="size: 1.5"
        animation-mixer="clip: Idle; loop: repeat" guide click-anim="clip: Dance; idle: Idle; loops: 3"></a-entity>
      <a-entity id="bubble" position="2.2 2.1 7.5" visible="false" look-at="#camera">
        <a-plane width="2.6" height="0.5" color="#ffffff" opacity="0.95"></a-plane>
        <a-text value="Hi! Welcome to the museum! Click me :)" align="center" color="#222" width="2.3" position="0 0 0.01"></a-text>
      </a-entity>

      <!-- Fox resting near Pisa: runs a few laps when clicked -->
      <a-entity id="fox" class="clickable" position="4.6 0 -0.6" rotation="0 -40 0"
        gltf-model="url(../hiro-model/models/fox.glb)" fit-model="size: 0.7"
        animation-mixer="clip: Survey; loop: repeat" click-anim="clip: Run; idle: Survey; loops: 4"></a-entity>

      <!-- ===== TELEPORT SPOTS (click to jump there) ===== -->
      <a-circle class="clickable" position="0 0.04 8" rotation="-90 0 0" radius="0.6" teleport="lookAt: 0 0 -4"
        material="color: #3bd1ff; opacity: 0.45; transparent: true"></a-circle>
      <a-circle class="clickable" position="-3.5 0.04 2.5" rotation="-90 0 0" radius="0.6" teleport="lookAt: -7 0 -4"
        material="color: #3bd1ff; opacity: 0.45; transparent: true"></a-circle>
      <a-circle class="clickable" position="3.5 0.04 2.5" rotation="-90 0 0" radius="0.6" teleport="lookAt: 7 0 -4"
        material="color: #3bd1ff; opacity: 0.45; transparent: true"></a-circle>
      <a-circle class="clickable" position="0 0.04 -9" rotation="-90 0 0" radius="0.6" teleport="lookAt: 0 0 8"
        material="color: #3bd1ff; opacity: 0.45; transparent: true"></a-circle>
      <a-circle class="clickable" position="-11 0.04 -8" rotation="-90 0 0" radius="0.6" teleport="lookAt: -7 0 -4"
        material="color: #3bd1ff; opacity: 0.45; transparent: true"></a-circle>
      <a-circle class="clickable" position="11 0.04 -8" rotation="-90 0 0" radius="0.6" teleport="lookAt: 7 0 -4"
        material="color: #3bd1ff; opacity: 0.45; transparent: true"></a-circle>
    </a-scene>

    <script>
      // Hide the loading screen once the scene is ready
      const scene = document.querySelector("a-scene");
      const hide = () => { const l = document.getElementById("loading"); l.style.opacity = 0; setTimeout(() => l.remove(), 700); };
      if (scene.hasLoaded) hide(); else scene.addEventListener("loaded", hide);

    </script>
  </body>
</html>
